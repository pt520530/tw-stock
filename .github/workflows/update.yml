name: 更新選股

on:
  schedule:
    # GitHub 的排程有時會漏跑，所以每個交易日晚上排好幾次；資料已經是當天的就只是重新發布，不會出錯
    - cron: '7 9 * * 1-5'     # 台灣時間 17:07
    - cron: '37 9 * * 1-5'    # 17:37
    - cron: '13 10 * * 1-5'   # 18:13
    - cron: '47 10 * * 1-5'   # 18:47
    - cron: '23 11 * * 1-5'   # 19:23
    - cron: '17 12 * * 1-5'   # 20:17
    - cron: '29 13 * * 1-5'   # 21:29
    - cron: '41 14 * * 1-5'   # 22:41
    - cron: '53 23 * * 0-4'   # 隔天早上 07:53（最後保險）
  workflow_dispatch:          # 可以在 Actions 頁面手動按「Run workflow」
  push:                       # 程式有更新時也跑一次
    branches: [main]
    paths-ignore: ['last-update.txt', 'README.md', 'CLAUDE.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-stock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 取回之前存的資料
        uses: actions/cache/restore@v4
        with:
          path: store
          key: store-${{ github.run_id }}
          restore-keys: store-

      - name: 抓資料並計算推薦
        run: node build-site.js

      - name: 保存資料給下次用
        if: always() && hashFiles('store/store.json') != ''
        uses: actions/cache/save@v4
        with:
          path: store
          key: store-${{ github.run_id }}

      - name: 記錄最後更新時間（避免 GitHub 60 天後自動停用排程）
        run: |
          git config user.name "168-stock-bot"
          git config user.email "168-stock-bot@users.noreply.github.com"
          git add last-update.txt
          git commit -m "更新選股 $(date -u +%F)" || echo "沒有變更"
          git pull --rebase || true
          git push || echo "推送失敗，不影響網站"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
